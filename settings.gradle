pluginManagement {
    repositories {
        google()
        // Google's mirror of Maven Central: CI kept failing on Maven Central's rate limit (429).
        maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }
        mavenCentral()
        gradlePluginPortal()
    }
}

